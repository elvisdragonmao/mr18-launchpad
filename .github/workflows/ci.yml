name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m py_compile mr18_launchpad.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          pip install -r requirements.txt

      - name: Run --help
        run: python mr18_launchpad.py --help

      - name: Check shell script
        run: |
          bash -n install_mr18_service.sh
          shellcheck install_mr18_service.sh
