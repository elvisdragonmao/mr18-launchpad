name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist
          zip -j dist/mr18-launchpad.zip \
            mr18_launchpad.py install_mr18_service.sh requirements.txt README.md

      - name: Extract release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mr18-launchpad.zip \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
